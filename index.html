<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Неделя</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Неделя">
<meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<style>
:root{
  --bg:#F2F2F7; --card:#FFFFFF; --text:#1C1C1E; --muted:#8E8E93; --line:#E5E5EA;
  --accent:#0A84FF; --today:#0A84FF; --danger:#FF3B30; --ok:#34C759; --sheet:#FFFFFF; --field:#F2F2F7;
  --req:#FF9500; --once:#34C759; --temp:#AF52DE;
  --shadow:0 1px 3px rgba(0,0,0,.06),0 4px 14px rgba(0,0,0,.05);
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#000; --card:#1C1C1E; --text:#F2F2F7; --line:#2C2C2E; --sheet:#1C1C1E; --field:#2C2C2E; --shadow:none; }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text)}
body{font:17px/1.35 -apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",sans-serif;
  touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;overscroll-behavior-y:none}
input{-webkit-user-select:text;user-select:text}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
/* Safari на iPhone не передаёт нажатия на обычный текст без cursor:pointer */
[data-act],.txt,.item{cursor:pointer}
.hidden{display:none!important}
.wrap{max-width:560px;margin:0 auto;padding:0 16px calc(env(safe-area-inset-bottom) + 40px)}

/* ---------- шапка ---------- */
.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);
  -webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);
  padding:calc(env(safe-area-inset-top) + 10px) 16px 10px;margin:0 -16px 6px;
  display:flex;align-items:flex-end;justify-content:space-between;gap:8px}
.top .date{color:var(--muted);font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.02em}
.top h1{margin:2px 0 0;font-size:32px;font-weight:800;letter-spacing:-.02em}
.top-btns{display:flex;gap:6px}
.icon-btn{width:40px;height:40px;border-radius:20px;background:var(--card);box-shadow:var(--shadow);
  display:grid;place-items:center;font-size:21px;color:var(--accent);font-weight:600}
.icon-btn:disabled{color:var(--muted);opacity:.45}
.icon-btn:active:not(:disabled){transform:scale(.92)}

/* ---------- счётчик недели ---------- */
.week{display:block;width:100%;text-align:left;background:var(--card);border-radius:16px;padding:12px 14px;margin-bottom:14px;box-shadow:var(--shadow)}
.week-top{display:flex;align-items:baseline;gap:6px;font-size:15px}
.week-top b{font-size:17px}
.week-top .more{margin-left:auto;color:var(--accent);font-size:14px;font-weight:600}
.bar{height:6px;border-radius:3px;background:var(--field);overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;border-radius:3px;background:var(--ok);transition:width .4s}

/* ---------- карточка дня ---------- */
.day{background:var(--card);border-radius:18px;padding:14px 14px 6px;margin-bottom:12px;box-shadow:var(--shadow);transition:box-shadow .2s}
.day.today{box-shadow:0 0 0 2px var(--today),var(--shadow)}
.day.collapsed{padding:0}
.day.drop{box-shadow:0 0 0 2px var(--accent),var(--shadow)}
.day-head{display:flex;align-items:center;gap:8px;width:100%;text-align:left}
.day.collapsed .day-head{padding:14px}
.dn{font-size:22px;font-weight:800}
.dd{font-size:14px;color:var(--muted);font-weight:500}
.day.today .dd{color:var(--today);font-weight:700}
.prog{margin-left:auto;font-size:14px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.prog.full{color:var(--ok)}
.dchev{color:var(--muted);font-size:20px;transition:transform .2s;margin-left:2px}
.day:not(.collapsed) .dchev{transform:rotate(90deg)}
.sum{font-size:13px;color:var(--muted);margin-top:1px}
.day .bar{margin:8px 0 2px}
.sec{margin-top:8px}
.sec-head{display:flex;align-items:center;justify-content:space-between;font-size:12px;font-weight:700;
  text-transform:uppercase;letter-spacing:.03em;color:var(--sc);margin:6px 0 2px}
.sec-head button{font-size:13px;color:var(--accent);text-transform:none;letter-spacing:0;font-weight:600;padding:4px 0}

/* ---------- пункты ---------- */
.items{list-style:none;margin:0;padding:0;min-height:6px}
.item{position:relative;overflow:hidden;border-radius:10px}
.item.dragged{display:none}
.ph{height:40px;border-radius:10px;border:2px dashed var(--accent);background:color-mix(in srgb,var(--accent) 8%,transparent);margin:2px 0}
.ghost{border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.25);transform:scale(1.03);opacity:.95}
.ghost .item-in{border-radius:10px}
.del-bg{position:absolute;inset:0;background:var(--danger);color:#fff;display:flex;align-items:center;justify-content:flex-end;
  padding-right:16px;font-size:15px;font-weight:600;opacity:0}
.item.swiping .del-bg{opacity:1}
.item-in{position:relative;display:flex;align-items:flex-start;gap:10px;padding:8px 2px;background:var(--card);transition:transform .2s}
.item.swiping .item-in{transition:none}
.item.removing{transition:max-height .22s,opacity .22s;max-height:0!important;opacity:0}
.cb{width:24px;height:24px;border-radius:12px;border:2px solid var(--line);flex:none;margin-top:1px;display:grid;place-items:center;
  color:#fff;font-size:14px;font-weight:800}
.item.done .cb{background:var(--sc);border-color:var(--sc)}
.txt{flex:1;min-width:0;word-break:break-word;padding-top:1px;min-height:24px}
.item.done .txt{color:var(--muted)}
.item.done .tt{text-decoration:line-through}
.moved{display:block;font-size:12px;color:var(--danger);font-weight:500}
.note{display:block;font-size:13px;color:var(--muted);margin-top:1px}
.edit-box{flex:1;min-width:0}
.edit-in,.note-in,.add input{width:100%;border:0;outline:none;background:transparent;color:var(--text);font:inherit;font-size:17px;padding:0}
.note-in{font-size:15px;color:var(--muted);margin-top:6px;padding:6px 8px;background:var(--field);border-radius:8px}
.add{display:flex;align-items:center;gap:10px;padding:8px 2px;color:var(--muted)}
.add .plus{width:24px;height:24px;border-radius:12px;display:grid;place-items:center;font-size:20px;color:var(--sc);flex:none}
.add input::placeholder{color:var(--muted)}

/* ---------- выдвижной список ---------- */
.temp{border-top:1px solid var(--line);margin-top:6px}
.temp-head{display:flex;align-items:center;gap:8px;width:100%;padding:10px 2px;text-align:left;color:var(--sc);font-weight:600;font-size:15px}
.chev{display:inline-block;transition:transform .2s;font-size:18px;width:14px}
.temp.open .chev{transform:rotate(90deg)}
.count{background:var(--sc);color:#fff;border-radius:10px;padding:0 7px;font-size:12px;font-weight:700;min-width:20px;text-align:center}
.temp-head small{margin-left:auto;color:var(--muted);font-weight:400;font-size:12px}
.cat{margin:0 0 4px}
.cat-head{font-size:13px;font-weight:700;color:var(--text);margin:8px 0 0;display:flex;justify-content:space-between}
.cat-head span{color:var(--muted);font-weight:600}
.cat .add{padding:5px 2px}
.cat .add input{font-size:16px}

/* ---------- нужно заказать ---------- */
.order{background:var(--card);border-radius:18px;padding:12px 14px 6px;margin-bottom:12px;box-shadow:0 0 0 2px var(--danger),var(--shadow);--sc:var(--danger)}
.order-head{display:flex;align-items:center;gap:8px;width:100%;text-align:left;padding-bottom:6px}
.order-head .t{font-size:20px;font-weight:800}
.order-head .count{background:var(--danger)}
.order-head .dchev{margin-left:auto}
.order.closed .dchev{transform:none}
.order:not(.closed) .dchev{transform:rotate(90deg)}
.order .hint{font-size:12px;color:var(--muted);margin:2px 0 6px}

/* ---------- панель снизу и сообщения ---------- */
.backdrop{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:50;display:flex;align-items:flex-end;justify-content:center;animation:fade .2s}
@keyframes fade{from{opacity:0}}
.sheet{background:var(--sheet);width:100%;max-width:560px;max-height:88vh;overflow-y:auto;border-radius:20px 20px 0 0;
  padding:8px 18px calc(env(safe-area-inset-bottom) + 18px);animation:up .25s ease}
@keyframes up{from{transform:translateY(100%)}}
.grab{width:38px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 10px}
.sheet h2{font-size:20px;margin:4px 0 12px}
.sheet p,.sheet li{color:var(--muted);font-size:15px}
.sheet ul{padding-left:20px;margin:6px 0 10px}
.btn{display:block;width:100%;padding:15px;border-radius:14px;font-weight:700;font-size:17px;text-align:center;margin-top:10px;background:var(--field)}
.btn.primary{background:var(--accent);color:#fff}
.group-title{font-size:13px;font-weight:600;color:var(--muted);text-transform:uppercase;margin:18px 2px 6px;display:flex;justify-content:space-between}
.hday{background:var(--field);border-radius:12px;margin-bottom:8px;overflow:hidden}
.hday summary{list-style:none;padding:12px 14px;display:flex;justify-content:space-between;font-weight:600;font-size:16px;cursor:pointer}
.hday summary::-webkit-details-marker{display:none}
.hday summary span{color:var(--muted);font-variant-numeric:tabular-nums}
.hday summary span.full{color:var(--ok)}
.hbody{padding:0 14px 10px}
.hsec{font-size:12px;font-weight:700;text-transform:uppercase;margin:8px 0 2px}
.hit{display:flex;gap:8px;font-size:15px;padding:3px 0;color:var(--text)}
.hit .m{width:18px;flex:none;text-align:center;font-weight:800}
.hit.no{color:var(--muted)}
.hit small{display:block;color:var(--muted);font-size:13px}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 20px);transform:translate(-50%,20px);
  background:rgba(30,30,30,.94);color:#fff;padding:10px 12px 10px 18px;border-radius:22px;font-size:15px;z-index:100;
  opacity:0;transition:.25s;pointer-events:none;display:flex;align-items:center;gap:12px;white-space:nowrap}
.toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast button{color:#64D2FF;font-weight:700;padding:4px 6px}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <div class="date" id="todayLabel"></div>
      <h1>Неделя</h1>
    </div>
    <div class="top-btns">
      <button class="icon-btn" id="undoBtn" data-act="undo" aria-label="Отменить" disabled>↶</button>
      <button class="icon-btn" id="redoBtn" data-act="redo" aria-label="Повторить" disabled>↷</button>
      <button class="icon-btn" data-act="menu" aria-label="Меню">•••</button>
    </div>
  </header>
  <button class="week" data-act="history" id="week"></button>
  <div id="order"></div>
  <div id="days"></div>
</div>
<div id="sheetRoot"></div>
<input type="file" id="importInput" accept="application/json,.json" class="hidden">
<div class="toast" id="toast"><span id="toastText"></span><button id="toastBtn" class="hidden"></button></div>

<script>
'use strict';
/* ============ Константы и даты ============ */
const KEY = 'nedelya-v1', UI_KEY = 'nedelya-ui';
const DAYS = ['Понедельник','Вторник','Среда','Четверг','Пятница','Суббота','Воскресенье'];
const DAYS_GEN = ['понедельника','вторника','среды','четверга','пятницы','субботы','воскресенья'];
const DAYS_ACC = ['понедельник','вторник','среду','четверг','пятницу','субботу','воскресенье'];
const MONTHS_GEN = ['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
const SECS = {
  req:  {title:'Обязательные', ph:'Добавить обязательное дело', color:'var(--req)'},
  once: {title:'Разовые дела', ph:'Добавить разовое дело',      color:'var(--once)'},
  temp: {title:'Список на день', ph:'Добавить в список',         color:'var(--temp)'}
};
const SEC_KEYS = ['req','once','temp'];
const CATS = ['Напитки','Алкоголь','Пиво','Бакалея','Крупы','Бытовая','Остальное'];
const OTHER = 'Остальное';
const normCat = c => CATS.includes(c) ? c : OTHER;
const HISTORY_DAYS = 120;
const pad = n => String(n).padStart(2,'0');
const dkey = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parseKey = k => { const [y,m,d] = k.split('-').map(Number); return new Date(y,m-1,d); };
const addDays = (d,n) => new Date(d.getFullYear(), d.getMonth(), d.getDate()+n);
const today = () => { const n = new Date(); return new Date(n.getFullYear(), n.getMonth(), n.getDate()); };
const wdi = d => (d.getDay()+6)%7;   // 0 = понедельник
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => 'i' + Date.now().toString(36) + Math.random().toString(36).slice(2,6);
function plural(n, one, few, many){
  const a = Math.abs(n)%100, b = a%10;
  if(a>10 && a<20) return many; if(b===1) return one; if(b>=2 && b<=4) return few; return many;
}
const fmtDate = d => `${d.getDate()} ${MONTHS_GEN[d.getMonth()]}`;

/* ============ Данные ============ */
function emptyState(){
  const w = () => ({0:[],1:[],2:[],3:[],4:[],5:[],6:[]});
  return {version:3, req:w(), once:w(), temp:w(), order:[], lastDate:null, history:{}};
}
function normItems(arr, withCat){
  return (Array.isArray(arr) ? arr : []).filter(x => x && typeof x.text==='string' && x.text.trim())
    .map(x => {
      const it = {id: typeof x.id==='string' ? x.id : uid(), text: x.text.slice(0,300), done: !!x.done};
      if(Number.isInteger(x.moved) && x.moved>=0 && x.moved<7) it.moved = x.moved;
      if(typeof x.note==='string' && x.note.trim()) it.note = x.note.slice(0,500);
      if(withCat) it.cat = normCat(x.cat);
      return it;
    });
}
function normalize(s){
  if(!s || typeof s!=='object') throw new Error('bad');
  const out = emptyState();
  for(const sec of SEC_KEYS){
    if(!s[sec] || typeof s[sec]!=='object') continue;
    for(let d=0; d<7; d++) out[sec][d] = normItems(s[sec][d], sec==='temp');
  }
  out.order = normItems(s.order, true);
  if(typeof s.lastDate==='string' && /^\d{4}-\d{2}-\d{2}$/.test(s.lastDate)) out.lastDate = s.lastDate;
  if(s.history && typeof s.history==='object'){
    for(const [k,v] of Object.entries(s.history)){
      if(!/^\d{4}-\d{2}-\d{2}$/.test(k) || !v || typeof v!=='object') continue;
      const day = {};
      for(const sec of SEC_KEYS) day[sec] = (Array.isArray(v[sec]) ? v[sec] : [])
        .filter(x => x && typeof x.t==='string').map(x => ({t:x.t, d:!!x.d, n: typeof x.n==='string' ? x.n : ''}));
      out.history[k] = day;
    }
  }
  return out;
}
function load(){
  let raw = null;
  try { raw = localStorage.getItem(KEY); } catch(e){ return emptyState(); }
  if(!raw) return emptyState();
  try { return normalize(JSON.parse(raw)); }
  catch(e){ try { localStorage.setItem(KEY+'-broken-'+Date.now(), raw); } catch(_){} return emptyState(); }
}
let state = load();
let ui = (() => { try { const u = JSON.parse(localStorage.getItem(UI_KEY)) || {}; return {open: u.open||{}, days: u.days||{}, orderClosed: !!u.orderClosed}; } catch(e){ return {open:{}, days:{}, orderClosed:false}; } })();
function save(){ try { localStorage.setItem(KEY, JSON.stringify(state)); } catch(e){ toast('Не удалось сохранить'); } }
function saveUi(){ try { localStorage.setItem(UI_KEY, JSON.stringify(ui)); } catch(e){} }

/* ============ Отмена / повтор ============ */
let undoStack = [], redoStack = [];
function commit(mutate){
  const before = JSON.stringify(state);
  mutate();
  if(JSON.stringify(state) === before) return false;
  undoStack.push(before);
  if(undoStack.length > 100) undoStack.shift();
  redoStack = [];
  save(); updateUndo();
  return true;
}
function undo(){
  if(!undoStack.length) return;
  redoStack.push(JSON.stringify(state));
  state = JSON.parse(undoStack.pop());
  save(); renderAll(); updateUndo(); toast('Отменено');
}
function redo(){
  if(!redoStack.length) return;
  undoStack.push(JSON.stringify(state));
  state = JSON.parse(redoStack.pop());
  save(); renderAll(); updateUndo(); toast('Повторено');
}
function updateUndo(){
  document.getElementById('undoBtn').disabled = !undoStack.length;
  document.getElementById('redoBtn').disabled = !redoStack.length;
}

/* ============ Смена дня ============
   Когда день недели прошёл:
   • всё, что было в этот день, записывается в историю (с отметками и заметками);
   • у обязательных дел снимаются галочки и заметки;
   • выдвижной список очищается;
   • выполненные разовые дела удаляются, невыполненные переезжают на сегодня. */
function rollover(){
  const t = today(), tk = dkey(t);
  if(!state.lastDate){ state.lastDate = tk; save(); return false; }
  if(state.lastDate >= tk) return false;
  let d = parseKey(state.lastDate);
  if((t - d) / 864e5 > 7) d = addDays(t, -7);
  const tw = wdi(t);
  let moved = 0, toOrder = 0;
  // заказанное (отмеченное) в «Нужно заказать» удаляется ночью
  state.order = state.order.filter(x => !x.done);
  for(; d < t; d = addDays(d,1)){
    const w = wdi(d), k = dkey(d);
    const snap = {};
    for(const sec of SEC_KEYS) snap[sec] = state[sec][w].map(x => ({t:x.text, d:!!x.done, n:x.note||''}));
    if(SEC_KEYS.some(s => snap[s].length)) state.history[k] = snap;
    state.req[w].forEach(x => { x.done = false; delete x.note; });
    // неотмеченное из списка на день → «Нужно заказать» (по разделам, без повторов)
    const have = new Set(state.order.map(x => normCat(x.cat) + '|' + x.text.trim().toLowerCase()));
    for(const x of state.temp[w]){
      if(x.done) continue;
      const key = normCat(x.cat) + '|' + x.text.trim().toLowerCase();
      if(have.has(key)) continue;
      have.add(key);
      const it = {id: uid(), text: x.text, done: false, cat: normCat(x.cat)};
      if(x.note) it.note = x.note;
      state.order.push(it); toOrder++;
    }
    state.temp[w] = [];
    const keep = state.once[w].filter(x => !x.done);
    state.once[w] = [];
    for(const x of keep){
      if(w !== tw && x.moved === undefined) x.moved = w;
      state.once[tw].push(x); moved++;
    }
  }
  const limit = dkey(addDays(t, -HISTORY_DAYS));
  for(const k of Object.keys(state.history)) if(k < limit) delete state.history[k];
  state.lastDate = tk;
  save();
  undoStack = []; redoStack = []; updateUndo();
  const msg = [moved ? `↪ На сегодня: ${moved}` : '', toOrder ? `🛒 В «Нужно заказать»: ${toOrder}` : ''].filter(Boolean).join(' · ');
  if(msg) setTimeout(() => toast(msg), 400);
  return true;
}

/* ============ Подсчёты ============ */
const ordered = arr => arr.filter(x => !x.done).concat(arr.filter(x => x.done));   // выполненные — вниз
function dayCount(w){
  const all = [...state.req[w], ...state.once[w]];
  return {done: all.filter(x => x.done).length, total: all.length};
}
function weekStats(){
  const t = today(), mon = addDays(t, -wdi(t));
  let done = 0, total = 0;
  for(let i=0; i<7; i++){
    const d = addDays(mon,i);
    if(d < t){
      const h = state.history[dkey(d)];
      if(h) for(const s of ['req','once']) for(const x of h[s]){ total++; if(x.d) done++; }
    } else {
      const c = dayCount(wdi(d)); done += c.done; total += c.total;
    }
  }
  return {done, total, mon, sun: addDays(mon,6)};
}

/* ============ Отрисовка ============ */
function itemHtml(it, w, sec){
  return `<li class="item ${it.done?'done':''}" data-id="${it.id}" data-day="${w}" data-sec="${sec}">
    <div class="del-bg">Удалить</div>
    <div class="item-in">
      <button class="cb" data-act="toggle" aria-label="${it.done?'Снять отметку':'Отметить'}">${it.done?'✓':''}</button>
      <span class="txt" data-act="edit"><span class="tt">${esc(it.text)}</span>${
        it.moved!==undefined && sec==='once' ? `<small class="moved">↪ перенесено с ${DAYS_GEN[it.moved]}</small>` : ''}${
        it.note ? `<small class="note">📝 ${esc(it.note)}</small>` : ''}</span>
    </div></li>`;
}
function addHtml(w, sec, ci){
  const ph = ci!==undefined ? 'Добавить' : SECS[sec].ph;
  return `<div class="add"><span class="plus">+</span>
    <input type="text" data-add="${sec}" data-day="${w}" ${ci!==undefined ? `data-cat="${ci}"` : ''} placeholder="${ph}" enterkeyhint="done" autocomplete="off" maxlength="300"></div>`;
}
const arrOf = (sec, w) => sec==='order' ? state.order : state[sec][w];
function setArr(sec, w, list){ if(sec==='order') state.order = list; else state[sec][w] = list; }
const catList = (sec, w, cat) => ordered(arrOf(sec,w).filter(x => normCat(x.cat)===cat));
function isOpenDay(w, offset){ return offset===0 || !!ui.days[w]; }
function dayHtml(w, date, offset){
  const label = offset===0 ? 'Сегодня' : offset===1 ? 'Завтра' : '';
  const ds = `${label ? label+', ' : ''}${fmtDate(date)}`;
  const c = dayCount(w);
  const head = `<span class="dn">${DAYS[w]}</span><span class="dd">${ds}</span>
    <span class="prog ${c.total && c.done===c.total ? 'full':''}" id="p-${w}">${c.total ? `${c.done} из ${c.total}` : ''}</span>`;
  if(!isOpenDay(w, offset)){
    const once = state.once[w].length, temp = state.temp[w].length;
    const parts = [`${state.req[w].length} ${plural(state.req[w].length,'обязательное','обязательных','обязательных')}`];
    if(once) parts.push(`${once} ${plural(once,'разовое','разовых','разовых')}`);
    if(temp) parts.push(`${temp} в списке`);
    return `<section class="day collapsed" data-day="${w}">
      <button class="day-head" data-act="day-toggle" data-day="${w}">
        <div style="flex:1;min-width:0"><div style="display:flex;align-items:baseline;gap:8px">${head}</div>
        <div class="sum">${parts.join(' · ')}</div></div><span class="dchev">›</span></button></section>`;
  }
  const open = !!ui.open[w];
  const sec = s => `<div class="sec" style="--sc:${SECS[s].color}">
      <div class="sec-head"><span>${SECS[s].title}</span>
        ${s==='req' ? `<button data-act="uncheck" data-day="${w}" id="un-${w}">Снять все</button>` : ''}</div>
      <ul class="items" id="l-${w}-${s}"></ul>${addHtml(w,s)}</div>`;
  return `<section class="day ${offset===0?'today':''}" data-day="${w}">
    ${offset===0 ? `<div class="day-head">${head}</div>`
      : `<button class="day-head" data-act="day-toggle" data-day="${w}">${head}<span class="dchev">›</span></button>`}
    ${offset===0 ? `<div class="bar"><i id="b-${w}" style="width:${c.total ? Math.round(c.done/c.total*100) : 0}%"></i></div>` : ''}
    ${sec('req')}${sec('once')}
    <div class="sec temp ${open?'open':''}" style="--sc:${SECS.temp.color}" id="t-${w}">
      <button class="temp-head" data-act="temp-toggle" data-day="${w}">
        <span class="chev">›</span>${SECS.temp.title}<span class="count" id="c-${w}"></span>
        <small>${offset===0 ? 'очистится в полночь' : 'очистится после ' + DAYS_GEN[w]}</small></button>
      <div class="temp-body ${open?'':'hidden'}">${CATS.map((c,ci) => `<div class="cat">
        <div class="cat-head">${c}<span id="cc-${w}-${ci}"></span></div>
        <ul class="items" id="l-${w}-temp-${ci}"></ul>${addHtml(w,'temp',ci)}</div>`).join('')}
        <p class="sum" style="margin:6px 2px 8px">Что не отмечено к концу дня — переедет в 🛒 «Нужно заказать».</p></div>
    </div>
  </section>`;
}
function renderList(w, sec, animate=true){
  if(sec==='order'){ renderOrder(); return; }
  if(sec==='temp'){
    CATS.forEach((c,ci) => {
      const list = catList('temp', w, c);
      renderUl(document.getElementById(`l-${w}-temp-${ci}`), list, w, sec, animate);
      const cc = document.getElementById(`cc-${w}-${ci}`);
      if(cc) cc.textContent = list.length ? list.length : '';
    });
  } else renderUl(document.getElementById(`l-${w}-${sec}`), ordered(state[sec][w]), w, sec, animate);
  if(sec==='req'){
    const b = document.getElementById(`un-${w}`);
    if(b) b.classList.toggle('hidden', !state.req[w].some(x => x.done));
  }
  if(sec==='temp'){
    const c = document.getElementById(`c-${w}`), n = state.temp[w].length;
    if(c){ c.textContent = n; c.classList.toggle('hidden', !n); }
  }
}
function renderOrder(){
  const box = document.getElementById('order');
  const n = state.order.length;
  if(!n){ box.innerHTML = ''; return; }
  const left = state.order.filter(x => !x.done).length;
  const closed = ui.orderClosed;
  box.innerHTML = `<div class="order ${closed?'closed':''}">
    <button class="order-head" data-act="order-toggle"><span class="t">🛒 Нужно заказать</span>
      <span class="count">${left}</span><span class="dchev">›</span></button>
    ${closed ? '' : `<div class="hint">Отмеченное (заказанное) исчезнет в полночь.</div>` +
      CATS.map((c,ci) => state.order.some(x => normCat(x.cat)===c)
        ? `<div class="cat"><div class="cat-head">${c}<span>${catList('order','o',c).filter(x=>!x.done).length || ''}</span></div>
           <ul class="items" id="l-o-order-${ci}"></ul></div>` : '').join('')}
  </div>`;
  if(!closed) CATS.forEach((c,ci) => {
    const ul = document.getElementById(`l-o-order-${ci}`);
    if(ul) renderUl(ul, catList('order','o',c), 'o', 'order', false);
  });
}
function renderUl(ul, list, w, sec, animate){
  if(!ul) return;
  const old = new Map();
  if(animate) for(const li of ul.children) if(li.dataset.id) old.set(li.dataset.id, li.getBoundingClientRect().top);
  ul.innerHTML = list.map(it => itemHtml(it, w, sec)).join('');
  if(animate && old.size){
    for(const li of ul.children){
      const o = old.get(li.dataset.id); if(o===undefined) continue;
      const dy = o - li.getBoundingClientRect().top;
      if(Math.abs(dy) < 2) continue;
      li.style.transition = 'none'; li.style.transform = `translateY(${dy}px)`;
      requestAnimationFrame(() => requestAnimationFrame(() => { li.style.transition = 'transform .3s ease'; li.style.transform = ''; }));
    }
  }
}
function renderMeta(){
  for(let w=0; w<7; w++){
    const c = dayCount(w), p = document.getElementById(`p-${w}`), b = document.getElementById(`b-${w}`);
    if(p){ p.textContent = c.total ? `${c.done} из ${c.total}` : ''; p.classList.toggle('full', !!c.total && c.done===c.total); }
    if(b) b.style.width = (c.total ? Math.round(c.done/c.total*100) : 0) + '%';
  }
  const s = weekStats();
  document.getElementById('week').innerHTML = `
    <div class="week-top">Неделя:<b>сделано ${s.done} из ${s.total}</b><span class="more">История ›</span></div>
    <div class="bar"><i style="width:${s.total ? Math.round(s.done/s.total*100) : 0}%"></i></div>`;
}
function renderAll(){
  const t = today();
  document.getElementById('todayLabel').textContent = `${DAYS[wdi(t)].toLowerCase()}, ${fmtDate(t)}`;
  let html = '';
  for(let i=0; i<7; i++){ const d = addDays(t,i); html += dayHtml(wdi(d), d, i); }
  document.getElementById('days').innerHTML = html;
  for(let w=0; w<7; w++) for(const s of SEC_KEYS) renderList(w, s, false);
  renderOrder();
  renderMeta();
}
function refresh(w, sec){ renderList(w, sec); renderMeta(); }

/* ============ Поиск пункта ============ */
function findItem(li){
  const sec = li.dataset.sec, w = sec==='order' ? 'o' : +li.dataset.day, id = li.dataset.id;
  const arr = arrOf(sec, w);
  return {w, sec, arr, idx: arr.findIndex(x => x.id===id)};
}

/* ============ Добавление ============ */
function addFrom(input){
  const text = input.value.trim();
  if(!text) return;
  const w = +input.dataset.day, sec = input.dataset.add;
  const it = {id: uid(), text, done:false};
  if(input.dataset.cat !== undefined) it.cat = CATS[+input.dataset.cat] || OTHER;
  commit(() => state[sec][w].push(it));
  input.value = '';
  refresh(w, sec);
}
document.addEventListener('keydown', e => {
  const t = e.target;
  if(t.matches && t.matches('input[data-add]') && e.key==='Enter'){ e.preventDefault(); addFrom(t); }
});
document.addEventListener('focusout', e => {
  const t = e.target;
  if(t.matches && t.matches('input[data-add]')) addFrom(t);
});

/* ============ Редактирование текста и заметки ============ */
let editing = null;
function startEdit(li){
  if(editing) finishEdit();
  const f = findItem(li); if(f.idx<0) return;
  const it = f.arr[f.idx];
  const span = li.querySelector('.txt');
  const box = document.createElement('div');
  box.className = 'edit-box';
  box.innerHTML = `<input class="edit-in" maxlength="300" enterkeyhint="next">
    <input class="note-in" maxlength="500" enterkeyhint="done" placeholder="Заметка: например, заказал 20 ящиков">`;
  const inp = box.querySelector('.edit-in'), note = box.querySelector('.note-in');
  inp.value = it.text; note.value = it.note || '';
  span.replaceWith(box);
  editing = {li, box, inp, note};
  inp.focus();
  try { inp.setSelectionRange(inp.value.length, inp.value.length); } catch(_){}
  inp.addEventListener('keydown', e => {
    if(e.key==='Enter'){ e.preventDefault(); note.focus(); }
    if(e.key==='Escape'){ e.preventDefault(); finishEdit(true); }
  });
  note.addEventListener('keydown', e => {
    if(e.key==='Enter'){ e.preventDefault(); finishEdit(); }
    if(e.key==='Escape'){ e.preventDefault(); finishEdit(true); }
  });
  box.addEventListener('focusout', () => setTimeout(() => {
    if(editing && editing.box===box && !box.contains(document.activeElement)) finishEdit();
  }, 0));
}
function finishEdit(cancelled=false){
  if(!editing) return;
  const {li, inp, note} = editing;
  editing = null;
  const f = findItem(li);
  const text = inp.value.trim(), nt = note.value.trim();
  if(!cancelled && f.idx>=0){
    if(!text){ commit(() => f.arr.splice(f.idx,1)); toast('Удалено', 'Отменить', undo); }
    else commit(() => {
      const it = f.arr[f.idx];
      it.text = text;
      if(nt) it.note = nt; else delete it.note;
    });
  }
  refresh(f.w, f.sec);
}

/* ============ Смахивание (удаление) и перетаскивание ============ */
let sw = null, lp = null, dg = null, blockClickUntil = 0;

function pressStart(li, x, y){
  if(editing && editing.li===li) return;
  sw = {li, x, y, dx:0, active:false};
  clearTimeout(lp && lp.timer);
  lp = {li, x, y, timer: setTimeout(() => dragBegin(li, x, y), 450)};
}
function lpCancel(){ if(lp){ clearTimeout(lp.timer); lp = null; } }

function pressMove(x, y, ev){
  if(dg){ if(ev && ev.cancelable) ev.preventDefault(); dg.x = x; dg.y = y; dragMove(); return; }
  if(lp && (Math.abs(x-lp.x) > 8 || Math.abs(y-lp.y) > 8)) lpCancel();
  if(!sw) return;
  const dx = x - sw.x, dy = y - sw.y;
  if(!sw.active){
    if(dx < -10 && Math.abs(dx) > Math.abs(dy)*1.3){ sw.active = true; sw.li.classList.add('swiping'); lpCancel(); }
    else if(Math.abs(dy) > 10 || dx > 10){ sw = null; return; }
  }
  if(sw.active){
    if(ev && ev.cancelable) ev.preventDefault();
    sw.dx = Math.min(0, dx);
    sw.li.querySelector('.item-in').style.transform = `translateX(${sw.dx}px)`;
  }
}
function pressEnd(){
  lpCancel();
  if(dg){ dragEnd(); return; }
  if(!sw) return;
  const {li, dx, active} = sw;
  sw = null;
  if(!active) return;
  blockClickUntil = Date.now() + 350;
  const inner = li.querySelector('.item-in');
  if(dx < -90){
    inner.style.transition = 'transform .18s'; inner.style.transform = 'translateX(-110%)';
    li.style.maxHeight = li.offsetHeight + 'px';
    setTimeout(() => {
      li.classList.add('removing');
      setTimeout(() => {
        const f = findItem(li);
        if(f.idx>=0) commit(() => f.arr.splice(f.idx,1));
        refresh(f.w, f.sec);
        toast('Удалено', 'Отменить', undo);
      }, 220);
    }, 160);
  } else {
    inner.style.transform = '';
    setTimeout(() => li.classList.remove('swiping'), 200);
  }
}

function dragBegin(li, x, y){
  lp = null; sw = null;
  if(!li.isConnected) return;
  const r = li.getBoundingClientRect();
  const ghost = li.cloneNode(true);
  ghost.classList.add('ghost');
  ghost.style.cssText = `position:fixed;left:${r.left}px;top:${r.top}px;width:${r.width}px;z-index:80;pointer-events:none;margin:0`;
  document.body.appendChild(ghost);
  const ph = document.createElement('li');
  ph.className = 'ph'; ph.style.height = r.height + 'px';
  li.after(ph);
  li.classList.add('dragged');
  dg = {li, ghost, ph, offY: y - r.top, x, y, target:null, src:{w:+li.dataset.day, sec:li.dataset.sec, id:li.dataset.id}};
  if(navigator.vibrate) navigator.vibrate(15);
  (function scrollLoop(){
    if(!dg) return;
    const edge = 90;
    if(dg.y < edge + 60) window.scrollBy(0, -Math.ceil((edge+60-dg.y)/6));
    else if(dg.y > innerHeight - edge) window.scrollBy(0, Math.ceil((dg.y-(innerHeight-edge))/6));
    dragMove();
    requestAnimationFrame(scrollLoop);
  })();
}
function dragMove(){
  if(!dg) return;
  dg.ghost.style.top = (dg.y - dg.offY) + 'px';
  document.querySelectorAll('.day.drop').forEach(d => d.classList.remove('drop'));
  const el = document.elementFromPoint(Math.min(Math.max(dg.x, 20), innerWidth-20), dg.y);
  if(!el) return;
  const collapsed = el.closest('.day.collapsed');
  if(collapsed){
    collapsed.classList.add('drop');
    dg.target = {w: +collapsed.dataset.day, sec: dg.src.sec==='order' ? 'temp' : dg.src.sec};
    if(dg.ph.isConnected) dg.ph.remove();
    return;
  }
  let ul = el.closest('.items');
  if(!ul){ const s = el.closest('.sec'); if(s) ul = s.querySelector('.items'); }
  if(!ul || ul.closest('.hidden')) return;
  dg.target = null;
  const items = [...ul.querySelectorAll('.item:not(.dragged)')];
  let before = null;
  for(const it of items){ const rr = it.getBoundingClientRect(); if(dg.y < rr.top + rr.height/2){ before = it; break; } }
  if(before){ if(dg.ph.nextSibling !== before || dg.ph.parentNode !== ul) ul.insertBefore(dg.ph, before); }
  else if(ul.lastElementChild !== dg.ph) ul.appendChild(dg.ph);
}
function dragEnd(){
  const d = dg; dg = null;
  blockClickUntil = Date.now() + 400;
  d.ghost.remove();
  document.querySelectorAll('.day.drop').forEach(x => x.classList.remove('drop'));
  let tw, tsec, tcat = null, idx = null;
  if(d.target){ tw = d.target.w; tsec = d.target.sec; }
  else if(d.ph.isConnected){
    const ul = d.ph.parentNode, parts = ul.id.split('-');          // l-<день>-<список>[-<раздел>]
    tw = parts[1]==='o' ? 'o' : +parts[1]; tsec = parts[2];
    if(parts[3] !== undefined) tcat = CATS[+parts[3]];
    idx = [...ul.children].filter(c => c===d.ph || (c.classList.contains('item') && !c.classList.contains('dragged'))).indexOf(d.ph);
  }
  d.ph.remove(); d.li.classList.remove('dragged');
  if(tw===undefined) return;
  const {sec:ss, id} = d.src, sw0 = ss==='order' ? 'o' : d.src.w;
  let srcCat = null;
  commit(() => {
    const src = arrOf(ss, sw0), i = src.findIndex(x => x.id===id);
    if(i<0) return;
    const [it] = src.splice(i,1);
    srcCat = it.cat !== undefined ? normCat(it.cat) : null;
    if(tsec!==ss || tw!==sw0) delete it.moved;
    const all = arrOf(tsec, tw);
    let list, rest;
    if(tsec==='temp' || tsec==='order'){
      it.cat = tcat || normCat(it.cat);
      list = ordered(all.filter(x => normCat(x.cat)===it.cat));
      rest = all.filter(x => normCat(x.cat)!==it.cat);
    } else { list = ordered(all); rest = []; }
    if(idx===null) idx = it.done ? list.length : list.filter(x => !x.done).length;
    list.splice(Math.min(idx, list.length), 0, it);
    setArr(tsec, tw, rest.concat(list));
  });
  const sameList = tw===sw0 && tsec===ss && (tcat===null || tcat===srcCat);
  renderList(sw0, ss, sameList); renderList(tw, tsec, sameList); renderMeta();
  if(tw!=='o' && tsec!=='order' && !document.querySelector(`[id^="l-${tw}-${tsec}"]`)) renderAll();
  if(!sameList){
    const where = (tcat && tw===sw0 && tsec===ss) ? `в раздел «${tcat}»`
      : tsec==='order' ? '🛒 в «Нужно заказать»'
      : tw!==sw0 ? `на ${DAYS_ACC[tw]}`
      : tcat ? `в раздел «${tcat}»` : `в «${SECS[tsec].title.toLowerCase()}»`;
    toast(`Перенесено ${where}`, 'Отменить', undo);
  }
}

// iPhone после касания присылает ещё и «мышиные» события — их пропускаем
let lastTouch = 0;
document.addEventListener('touchstart', () => { lastTouch = Date.now(); }, {passive:true, capture:true});
document.addEventListener('touchstart', e => {
  const li = e.target.closest('.item'); if(!li || e.target.closest('input')) return;
  const t = e.touches[0]; pressStart(li, t.clientX, t.clientY);
}, {passive:true});
document.addEventListener('touchmove', e => { if(sw || lp || dg){ const t = e.touches[0]; pressMove(t.clientX, t.clientY, e); } }, {passive:false});
document.addEventListener('touchend', pressEnd);
document.addEventListener('touchcancel', pressEnd);
const fromTouch = () => Date.now() - lastTouch < 1000;
document.addEventListener('mousedown', e => {
  if(fromTouch()) return;
  const li = e.target.closest('.item'); if(!li || e.button!==0 || e.target.closest('input')) return;
  pressStart(li, e.clientX, e.clientY);
});
document.addEventListener('mousemove', e => { if(!fromTouch() && (sw || lp || dg)) pressMove(e.clientX, e.clientY, null); });
document.addEventListener('mouseup', () => { if(!fromTouch()) pressEnd(); });
document.addEventListener('contextmenu', e => { if(e.target.closest('.item')) e.preventDefault(); });

/* ============ Нажатия ============ */
document.addEventListener('click', e => {
  const t = e.target.closest('[data-act]');
  if(!t) return;
  if(Date.now() < blockClickUntil && t.closest('.item')) return;
  const a = t.dataset.act;
  const li = t.closest('.item');
  switch(a){
    case 'toggle': {
      const f = findItem(li); if(f.idx<0) break;
      commit(() => { f.arr[f.idx].done = !f.arr[f.idx].done; });
      refresh(f.w, f.sec);
      break;
    }
    case 'edit': startEdit(li); break;
    case 'uncheck': {
      const w = +t.dataset.day;
      commit(() => state.req[w].forEach(x => x.done = false));
      refresh(w, 'req');
      break;
    }
    case 'temp-toggle': {
      const w = +t.dataset.day;
      ui.open[w] = !ui.open[w]; saveUi();
      const box = document.getElementById(`t-${w}`);
      box.classList.toggle('open', ui.open[w]);
      box.querySelector('.temp-body').classList.toggle('hidden', !ui.open[w]);
      break;
    }
    case 'day-toggle': {
      const w = +t.dataset.day;
      ui.days[w] = !ui.days[w]; saveUi();
      renderAll();
      break;
    }
    case 'history': historySheet(); break;
    case 'order-toggle': ui.orderClosed = !ui.orderClosed; saveUi(); renderOrder(); break;
    case 'undo': undo(); break;
    case 'redo': redo(); break;
    case 'menu': menuSheet(); break;
    case 'sheet-bg': if(e.target===t) closeSheet(); break;
    case 'sheet-close': closeSheet(); break;
    case 'export': exportData(); break;
    case 'import': document.getElementById('importInput').click(); break;
    case 'imp-merge': {
      if(!pendingImport) break;
      const n = importMerge(pendingImport); pendingImport = null;
      closeSheet(); renderAll(); toast(n ? `Добавлено дел: ${n}` : 'Всё это уже есть', n ? 'Отменить' : null, undo);
      break;
    }
    case 'imp-replace':
      if(!pendingImport) break;
      importReplace(pendingImport); pendingImport = null;
      closeSheet(); renderAll(); toast('Данные заменены', 'Отменить', undo);
      break;
  }
});

/* ============ История ============ */
function historySheet(){
  const keys = Object.keys(state.history).sort().reverse();
  const s = weekStats();
  let html = `<h2>История</h2>
    <p>Эта неделя (${fmtDate(s.mon)} – ${fmtDate(s.sun)}): сделано <b style="color:var(--text)">${s.done} из ${s.total}</b>.</p>`;
  if(!keys.length){
    html += `<p>Здесь появятся прошедшие дни: что было сделано, что нет, и ваши заметки. Первая запись — после окончания сегодняшнего дня.</p>`;
  } else {
    const weeks = new Map();
    for(const k of keys){
      const d = parseKey(k), mon = dkey(addDays(d, -wdi(d)));
      if(!weeks.has(mon)) weeks.set(mon, []);
      weeks.get(mon).push(k);
    }
    for(const [mon, days] of weeks){
      let wd = 0, wt = 0;
      for(const k of days) for(const sec of ['req','once']) for(const x of state.history[k][sec]){ wt++; if(x.d) wd++; }
      const m = parseKey(mon);
      html += `<div class="group-title"><span>${fmtDate(m)} – ${fmtDate(addDays(m,6))}</span><span>${wd} из ${wt}</span></div>`;
      for(const k of days){
        const h = state.history[k], d = parseKey(k);
        const all = [...h.req, ...h.once], dn = all.filter(x => x.d).length;
        const list = sec => h[sec].length ? `<div class="hsec" style="color:${SECS[sec].color}">${SECS[sec].title}</div>` +
          h[sec].map(x => `<div class="hit ${x.d?'':'no'}"><span class="m" style="color:${x.d?'var(--ok)':'var(--danger)'}">${x.d?'✓':'✕'}</span>
            <span>${esc(x.t)}${x.n ? `<small>📝 ${esc(x.n)}</small>` : ''}</span></div>`).join('') : '';
        html += `<details class="hday"><summary>${DAYS[wdi(d)]}, ${fmtDate(d)}
            <span class="${all.length && dn===all.length ? 'full':''}">${dn} из ${all.length}</span></summary>
          <div class="hbody">${list('req')}${list('once')}${list('temp')}</div></details>`;
      }
    }
    html += `<p style="font-size:13px">История хранится ${HISTORY_DAYS} дней.</p>`;
  }
  openSheet(html + `<button class="btn" data-act="sheet-close">Закрыть</button>`);
}

/* ============ Меню ============ */
function openSheet(html){
  document.getElementById('sheetRoot').innerHTML =
    `<div class="backdrop" data-act="sheet-bg"><div class="sheet"><div class="grab"></div>${html}</div></div>`;
}
function closeSheet(){ document.getElementById('sheetRoot').innerHTML = ''; }
function menuSheet(){
  openSheet(`<h2>Неделя</h2>
    <div class="group-title">Как пользоваться</div>
    <ul>
      <li><b style="color:var(--req)">Обязательные</b> — повторяются каждую неделю. Когда день прошёл, галочки снимаются сами (отметки сохраняются в истории).</li>
      <li><b style="color:var(--once)">Разовые</b> — когда день прошёл, выполненные удаляются, а невыполненные переезжают на сегодня.</li>
      <li><b style="color:var(--temp)">Список на день</b> — по разделам (Напитки, Пиво, Бакалея…). Когда день прошёл, отмеченное удаляется, а неотмеченное переезжает в <b style="color:var(--danger)">🛒 Нужно заказать</b> — в тот же раздел.</li>
      <li><b style="color:var(--danger)">Нужно заказать</b> — отметьте заказанное, и оно исчезнет в полночь.</li>
      <li>Нажмите на текст, чтобы исправить его или добавить заметку.</li>
      <li>Смахните влево, чтобы удалить. Удерживайте и тяните, чтобы переставить — можно в другой список или на другой день.</li>
      <li>Нажмите на название дня, чтобы свернуть или развернуть его.</li>
      <li>↶ ↷ вверху — отменить и повторить действие.</li>
    </ul>
    <div class="group-title">Резервная копия</div>
    <p>Всё хранится только на этом телефоне. Сохраняйте копию в «Файлы» или iCloud.</p>
    <button class="btn primary" data-act="export">💾 Сохранить копию</button>
    <button class="btn" data-act="import">📂 Загрузить из файла</button>
    <button class="btn" data-act="sheet-close">Закрыть</button>`);
}
async function exportData(){
  const json = JSON.stringify(state, null, 2), name = `nedelya-${dkey(today())}.json`;
  let file = null; try { file = new File([json], name, {type:'application/json'}); } catch(e){}
  if(file && navigator.canShare && navigator.canShare({files:[file]})){
    try { await navigator.share({files:[file], title:'Неделя — резервная копия'}); return; }
    catch(e){ if(e && e.name==='AbortError') return; }
  }
  const url = URL.createObjectURL(new Blob([json], {type:'application/json'}));
  const a = document.createElement('a'); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
  toast('Копия сохранена');
}
let pendingImport = null;
document.getElementById('importInput').addEventListener('change', async e => {
  const f = e.target.files && e.target.files[0]; e.target.value = '';
  if(!f) return;
  let data;
  try { data = normalize(JSON.parse(await f.text())); }
  catch(err){ toast('Это не файл резервной копии'); return; }
  pendingImport = data;
  const n = SEC_KEYS.reduce((s,sec) => s + Object.values(data[sec]).reduce((a,arr) => a + arr.length, 0), 0);
  openSheet(`<h2>Загрузить из файла</h2>
    <p>В файле ${n} ${plural(n,'дело','дела','дел')}.</p>
    <button class="btn primary" data-act="imp-merge">➕ Добавить к моим делам</button>
    <p style="font-size:13px;margin:6px 2px 0">Повторы пропускаются. Ваши дела останутся.</p>
    <button class="btn" data-act="imp-replace">Заменить всё</button>
    <button class="btn" data-act="sheet-close">Отмена</button>`);
});
function importMerge(data){
  let added = 0;
  commit(() => {
    for(const sec of SEC_KEYS) for(let d=0; d<7; d++){
      const have = new Set(state[sec][d].map(x => x.text.trim().toLowerCase()));
      for(const it of data[sec][d]){
        const k = it.text.trim().toLowerCase();
        if(have.has(k)) continue;
        have.add(k);
        const n = {id: uid(), text: it.text, done: false};
        if(it.note) n.note = it.note;
        if(it.cat) n.cat = it.cat;
        state[sec][d].push(n);
        added++;
      }
    }
    const haveO = new Set(state.order.map(x => normCat(x.cat) + '|' + x.text.trim().toLowerCase()));
    for(const it of data.order){
      const k = normCat(it.cat) + '|' + it.text.trim().toLowerCase();
      if(haveO.has(k)) continue;
      haveO.add(k);
      state.order.push({id: uid(), text: it.text, done: it.done, cat: normCat(it.cat)});
      added++;
    }
    for(const [k,v] of Object.entries(data.history)) if(!state.history[k]) state.history[k] = v;
  });
  return added;
}
function importReplace(data){
  const keepDate = state.lastDate;
  commit(() => { state = data; state.lastDate = keepDate; });
}

/* ============ Сообщения ============ */
let toastTimer = null;
function toast(text, btnText, onBtn){
  const el = document.getElementById('toast'), b = document.getElementById('toastBtn');
  document.getElementById('toastText').textContent = text;
  if(btnText){ b.textContent = btnText; b.classList.remove('hidden'); b.onclick = () => { el.classList.remove('show'); onBtn(); }; }
  else { b.classList.add('hidden'); b.onclick = null; }
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), btnText ? 4000 : 1600);
}

/* ============ Старт и смена дня ============ */
function tick(){
  if(editing || dg || (document.activeElement && document.activeElement.matches && document.activeElement.matches('input'))) return;
  if(rollover()) renderAll(); else renderMeta();
}
document.addEventListener('visibilitychange', () => { if(document.visibilityState==='visible') tick(); });
setInterval(tick, 60000);

if(navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(()=>{});
if('serviceWorker' in navigator && (location.protocol==='https:' || location.hostname==='localhost' || location.hostname==='127.0.0.1')){
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(()=>{}));
}

rollover();
renderAll();
updateUndo();
</script>
